services:
  website-niaefeup-frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./src:/usr/src/website-niaefeup-frontend/src
      - ./static:/usr/src/website-niaefeup-frontend/static
    environment:
      - PORT=3000
    network_mode: 'host'

  website-niaefeup-frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./src:/usr/src/website-niaefeup-frontend/src
      - ./static:/usr/src/website-niaefeup-frontend/static
    stdin_open: true
    tty: true
