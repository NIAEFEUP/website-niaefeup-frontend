name: Audit

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit
